<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - UroSmart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="permission-body">
    <div class="login-card">
        <div class="logo-container">
            <img src="assets/logo.png" alt="Logo">
            <div class="logo-text">UROSMART</div>
        </div>
        <h2>Forgot Password?</h2>
        <p class="subtitle">Enter your registered email address to reset your password</p>
        
        <form id="forgot-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="enter your email" required>
                </div>
            </div>

            <div id="message" style="margin-top: 1rem; font-size: 0.9rem; color: #FF3B30; display: none; margin-bottom: 1.5rem;"></div>

            <button type="submit" class="btn-login">Continue</button>
        </form>

        <p class="signup-footer"><a href="login.html">← Back to Login</a></p>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('forgot-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const messageDiv = document.getElementById('message');
            messageDiv.style.display = 'none';

            try {
                const result = await apiRequest('auth/check-email.php', { email });
                // If email exists, proceed to reset screen
                sessionStorage.setItem('reset_email', email);
                window.location.href = 'reset-password.html';
            } catch (error) {
                messageDiv.textContent = error.message;
                messageDiv.style.display = 'block';
            }
        };
    </script>
</body>
</html>
