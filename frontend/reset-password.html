<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - UroSmart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="permission-body">
    <div class="login-card">
        <div class="logo-container">
            <img src="assets/logo.png" alt="Logo">
            <div class="logo-text">UROSMART</div>
        </div>
        <h2>Reset Password</h2>
        
        <form id="reset-form">
            <div class="form-group">
                <label for="password">New Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="enter new password" required>
                    <img src="assets/eye.svg" alt="Toggle" class="password-toggle">
                </div>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <div class="input-wrapper">
                    <input type="password" id="confirm-password" placeholder="Confirm Password" required>
                    <img src="assets/eye.svg" alt="Toggle" class="password-toggle">
                </div>
            </div>

            <div id="message" style="margin-top: 1rem; font-size: 0.9rem; color: #FF3B30; display: none; margin-bottom: 1.5rem;"></div>

            <button type="submit" class="btn-login">Confirm</button>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('reset-form').onsubmit = async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const email = sessionStorage.getItem('reset_email');
            const messageDiv = document.getElementById('message');
            messageDiv.style.display = 'none';

            if (!email) {
                alert('Session expired. Please try again.');
                window.location.href = 'forgot-password.html';
                return;
            }

            if (password !== confirmPassword) {
                messageDiv.textContent = 'Passwords do not match';
                messageDiv.style.display = 'block';
                return;
            }

            try {
                const result = await apiRequest('auth/reset-password-email.php', { email, new_password: password });
                alert('Password reset successfully! Please login.');
                sessionStorage.removeItem('reset_email');
                window.location.href = 'login.html';
            } catch (error) {
                messageDiv.textContent = error.message;
                messageDiv.style.display = 'block';
            }
        };
    </script>
</body>
</html>
